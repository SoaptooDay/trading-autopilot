name: Backtest strategies
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading sessions to test"
        default: "60"
permissions:
  contents: read
concurrency:
  group: autopilot-journal
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the private journal
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/trading-journal
          token: ${{ secrets.JOURNAL_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run autopilot (paper)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          AUTOPILOT_DATA: ${{ github.workspace }}/data
          AUTOPILOT_QUIET: "1"
        run: python autopilot/research.py backtest --days ${{ inputs.days }}
      - name: Save to the private journal
        if: always()
        working-directory: data
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "autopilot $(date -u +%F) backtest.yml"
          git pull -q --rebase && git push -q
